# Docker entrypoint resolves CF_TRUSTED_PROXY before substituting this template.
# nginx always receives unix: or one exact trusted peer IP.
set_real_ip_from ${CF_TRUSTED_PROXY};
real_ip_header CF-Connecting-IP;
map $realip_remote_addr $trusted_cf_peer {
    default 0;
    "${CF_TRUSTED_PROXY}" 1;
}
map "$trusted_cf_peer:$http_x_forwarded_proto" $origin_scheme {
    default $scheme;
    "1:https" https;
    "1:http" http;
}

# ============================================
# 소셜 미디어 크롤러(봇) User-Agent 감지
# OG 메타태그 제공을 위해 봇 요청을 FastAPI로 프록시
# ============================================
map $http_user_agent $is_bot {
    default                     0;
    ~*facebookexternalhit       1;
    ~*Facebot                   1;
    ~*Twitterbot                1;
    ~*LinkedInBot               1;
    ~*Slackbot                  1;
    ~*Discordbot                1;
    ~*TelegramBot               1;
    ~*WhatsApp                  1;
    ~*kakaotalk-scrap           1;
    ~*naver                     1;
    ~*Googlebot                 1;
    ~*bingbot                   1;
    ~*yandex                    1;
}

server {
    listen 8080;
    server_name _;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $origin_scheme;
    # Backend and nginx both protect responses; avoid duplicate header fields.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;

    # ============================================
    # 보안 헤더 (HSTS는 Cloudflare 대시보드에서 설정)
    # ============================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://cloudflareinsights.com https://*.cloudflareinsights.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self';" always;

    # SPA 정적 파일
    root /usr/share/nginx/html;
    index index.html;

    # gzip 압축
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Every image request passes through the backend visibility check.
    location /uploads/ {
        proxy_pass http://server:8000;
    }

    location /og/ {
        proxy_pass http://server:8000;
    }

    # API 리버스 프록시
    location /api/ {
        proxy_pass http://server:8000;

        # 타임아웃 설정
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # 파일 업로드를 위한 크기 제한
        client_max_body_size 10m;
    }

    # Swagger / ReDoc 문서 프록시
    location /docs {
        proxy_pass http://server:8000;
    }

    location /redoc {
        proxy_pass http://server:8000;
    }

    location /openapi.json {
        proxy_pass http://server:8000;
    }

    # 헬스 체크 프록시
    location /health {
        proxy_pass http://server:8000;
    }

    # ============================================
    # OG 메타태그: 봇이 /board/{id} 접근 시 FastAPI로 프록시
    # ============================================
    location ~ ^/board/(\d+)$ {
        if ($is_bot) {
            rewrite ^/board/(\d+)$ /og/board/$1 break;
            proxy_pass http://server:8000;
        }
        try_files $uri /index.html;
    }

    # SPA 라우팅 폴백
    location / {
        try_files $uri $uri/ /index.html;
    }
}
